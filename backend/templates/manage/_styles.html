<style>
    .mng-stat-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(10px, 1.2vw, 16px);

    }

    .mng-stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: clamp(10px, 1.1vw, 14px);
        padding: clamp(12px, 1.4vw, 18px) clamp(14px, 1.6vw, 20px);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.2vw, 14px);
        min-width: 0;
    }

    a.mng-stat-card {
        text-decoration: none;
        color: inherit;
        transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        cursor: pointer;
    }

    a.mng-stat-card:hover {
        transform: translateY(-2px);
    }

    a.mng-stat-card::after {
        content: '\f061';
        font-family: 'Font Awesome 6 Free';
        font-weight: 900;
        margin-left: auto;
        font-size: clamp(10px, 1vw, 12px);
        color: var(--text-muted);
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        flex-shrink: 0;
    }

    a.mng-stat-card:hover::after {
        opacity: 1;
        transform: translateX(2px);
    }

    /* 위 4칸: 틴트 + 상단 라인 */
    .mng-stat-card[class*="mng-stat-card--"]:not([class*="--fill-"]) {
        position: relative;
        overflow: hidden;
    }

    .mng-stat-card[class*="mng-stat-card--"]:not([class*="--fill-"])::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: clamp(2px, 0.25vw, 3px);
    }

    .mng-stat-card--accent {
        background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(123, 94, 167, 0.08));
        border-color: rgba(0, 212, 255, 0.28);
    }

    .mng-stat-card--accent::before {
        background: linear-gradient(90deg, #00d4ff, #7b5ea7);
    }

    .mng-stat-card--green {
        background: linear-gradient(135deg, rgba(34, 197, 94, 0.14), rgba(22, 163, 74, 0.06));
        border-color: rgba(34, 197, 94, 0.32);
    }

    .mng-stat-card--green::before {
        background: linear-gradient(90deg, #22c55e, #16a34a);
    }

    .mng-stat-card--orange {
        background: linear-gradient(135deg, rgba(251, 146, 60, 0.14), rgba(234, 88, 12, 0.06));
        border-color: rgba(251, 146, 60, 0.32);
    }

    .mng-stat-card--orange::before {
        background: linear-gradient(90deg, #fb923c, #ea580c);
    }

    .mng-stat-card--teal {
        background: linear-gradient(135deg, rgba(45, 212, 191, 0.14), rgba(8, 145, 178, 0.06));
        border-color: rgba(45, 212, 191, 0.32);
    }

    .mng-stat-card--teal::before {
        background: linear-gradient(90deg, #2dd4bf, #0891b2);
    }

    /* 아래 4칸: 아이콘 색으로 칸 전체 채우기 */
    a.mng-stat-card[class*="--fill-"] {
        position: relative;
        overflow: hidden;
        border-color: transparent;
        box-shadow: var(--shadow-sm);
    }

    a.mng-stat-card[class*="--fill-"] .mng-stat-value,
    a.mng-stat-card[class*="--fill-"] .mng-stat-label {
        color: #fff;

    a.mng-stat-card[class*="--fill-"] .mng-stat-icon {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
    }

    a.mng-stat-card--fill-violet {
        background: linear-gradient(135deg, #a78bfa, #7c3aed);
    }

    a.mng-stat-card--fill-violet:hover {
        box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
    }

    a.mng-stat-card--fill-violet::after { color: rgba(255, 255, 255, 0.85); }

    a.mng-stat-card--fill-green {
        background: linear-gradient(135deg, #22c55e, #16a34a);

    a.mng-stat-card--fill-green:hover {

    }

        box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);

    a.mng-stat-card--fill-accent::after { color: rgba(255, 255, 255, 0.85); }

    .mng-col-label { width: 118px; }
